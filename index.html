  <body class="h-full font-sans bg-slate-950 text-slate-100 selection:bg-emerald-500 selection:text-slate-950">
    <div id="root" class="min-h-full flex flex-col"></div>
    <!-- Launch screen for the Android app (and installed web app); src/main.tsx fades it out -->
    <!-- Animated launch screen: shown in the app every launch and on the website once per visit -->
    <style>
      #boot-splash{position:fixed;inset:0;z-index:200;background:#0f1412;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .4s ease}
      #boot-splash .tile{transform-origin:50% 50%;animation:bs-tile .6s cubic-bezier(.34,1.56,.64,1) both}
      #boot-splash .glow{transform-origin:32px 45px;opacity:0;animation:bs-glow 1.2s .9s ease-out forwards}
      #boot-splash .body{stroke-dasharray:130;stroke-dashoffset:130;fill-opacity:0;animation:bs-draw .55s .25s ease-out forwards,bs-fill .3s .6s ease-out forwards}
      #boot-splash .shelf{stroke-dasharray:24;stroke-dashoffset:24;animation:bs-line .3s .65s ease-out forwards}
      #boot-splash .handle{stroke-dasharray:8;stroke-dashoffset:8;animation:bs-line .25s .8s ease-out forwards}
      #boot-splash .hat{transform-origin:32px 22px;animation:bs-hat .6s .55s cubic-bezier(.34,1.56,.64,1) both}
      #boot-splash .spark{transform-origin:36px 45px;animation:bs-spark .5s .95s cubic-bezier(.34,1.56,.64,1) both}
      #boot-splash .name span{display:inline-block;opacity:0;transform:translateY(14px);animation:bs-rise .45s cubic-bezier(.2,0,0,1) forwards}
      #boot-splash .tag{opacity:0;animation:bs-fade .5s 1.45s ease-out forwards}
      @keyframes bs-tile{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
      @keyframes bs-draw{to{stroke-dashoffset:0}}
      @keyframes bs-fill{to{fill-opacity:1}}
      @keyframes bs-line{to{stroke-dashoffset:0}}
      @keyframes bs-hat{from{transform:translateY(-22px) scale(.6);opacity:0}to{transform:none;opacity:1}}
      @keyframes bs-spark{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
      @keyframes bs-glow{0%{opacity:.7;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}
      @keyframes bs-rise{to{opacity:1;transform:none}}
      @keyframes bs-fade{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){#boot-splash *{animation-duration:1ms!important;animation-delay:0s!important}}
    </style>
    <div id="boot-splash" aria-hidden="true">
      <svg class="tile" viewBox="0 0 64 64" width="120" height="120">
        <rect x="2" y="2" width="60" height="60" rx="16" fill="#FF5A3C" />
        <circle class="glow" cx="36" cy="45" r="8" fill="#3DDC84" />
        <rect class="body" x="20" y="21" width="24" height="36" rx="5" fill="#0A0C0B" stroke="#F5F1E8" stroke-width="2.5" />
        <line class="shelf" x1="20" y1="33" x2="44" y2="33" stroke="#F5F1E8" stroke-width="2.5" />
        <line class="handle" x1="25" y1="25.5" x2="25" y2="29" stroke="#FF5A3C" stroke-width="2.5" stroke-linecap="round" />
        <line class="handle" x1="25" y1="37.5" x2="25" y2="44" stroke="#FF5A3C" stroke-width="2.5" stroke-linecap="round" />
        <path class="hat" d="M22 22c-3.6 0-6-2.6-6-5.6 0-3.2 2.7-5.6 5.9-5.4C23.1 8.6 25.4 7 28 7c1.6 0 3 .6 4 1.6C33 7.6 34.4 7 36 7c2.6 0 4.9 1.6 6.1 4 3.2-.2 5.9 2.2 5.9 5.4 0 3-2.4 5.6-6 5.6z" fill="#F5F1E8" />
        <path class="spark" d="M36 40l1.5 3.5L41 45l-3.5 1.5L36 50l-1.5-3.5L31 45l3.5-1.5z" fill="#3DDC84" />
      </svg>
      <div class="name" style="font:700 30px/1.1 'Google Sans Flex',Roboto,system-ui,sans-serif;color:#f5f1e8;letter-spacing:-.01em;margin-top:12px"></div>
      <div class="tag" style="font:400 13px/1.3 'Google Sans Flex',Roboto,system-ui,sans-serif;color:#a0aaa5">With Love from TheFlightTech Labs</div>
    </div>
    <script>
      (function () {
        var app = window.Capacitor || matchMedia('(display-mode: standalone)').matches;
        var seen = false;
        try { seen = sessionStorage.getItem('fridgechef.splashSeen') === '1'; sessionStorage.setItem('fridgechef.splashSeen', '1'); } catch (e) {}
        if (!app && seen) return;
        var s = document.getElementById('boot-splash');
        var name = s.querySelector('.name');
        'FridgeChef-AI'.split('').forEach(function (ch, i) {
          var span = document.createElement('span');
          span.textContent = ch;
          span.style.animationDelay = (1.05 + i * 0.035) + 's';
          name.appendChild(span);
        });
        s.style.display = 'flex';
        window.__bootSplashAt = Date.now();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
