name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'FridgeChef server URL baked into the app (optional)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The default package list includes the long-removed 'tools' package, which current
      # sdkmanager rejects; only platform-tools is needed (Gradle fetches the rest)
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run lint
          npm test

      - name: Build web app and sync into Android
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.FRIDGECHEF_API_BASE_URL }}
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        env:
          FRIDGECHEF_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: fridgechef-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Tagging vX.Y.Z publishes a GitHub release with the APK and that version's CHANGELOG section
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "FridgeChef-${version}.apk"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[0-9.]+\]:/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          printf '\n### Install\nDownload `FridgeChef-%s.apk` below and open it on your Android phone (allow installs from your browser when asked).\n' "$version" >> release-notes.md
          cat release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FridgeChef ${{ github.ref_name }}
          body_path: release-notes.md
          files: FridgeChef-*.apk
